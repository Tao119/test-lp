<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker Destination Check</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #e0e0e0; }
    h1 { color: #4ecdc4; font-size: 18px; margin-bottom: 20px; }
    h2 { color: #aaa; font-size: 14px; margin: 20px 0 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .box { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 12px; margin-bottom: 8px; word-break: break-all; }
    .key { color: #f7c873; }
    .val { color: #a8e6cf; }
    .empty { color: #e74c3c; font-style: italic; }
    .ok { color: #2ecc71; }
    .warn { color: #f39c12; }
    .result-box { font-size: 20px; padding: 16px; text-align: center; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>📡 Tracker Destination Check</h1>

  <div id="summary" class="result-box"></div>

  <h2>document.referrer</h2>
  <div class="box" id="referrer"></div>

  <h2>URL Parameters (window.location.search)</h2>
  <div id="params"></div>

  <h2>Raw URL</h2>
  <div class="box" id="rawurl"></div>

  <h2>Timestamp</h2>
  <div class="box" id="timestamp"></div>

  <script>
    const referrer = document.referrer;
    const params = new URLSearchParams(window.location.search);
    const paramEntries = [...params.entries()];

    // Referrer
    const refEl = document.getElementById('referrer');
    if (referrer) {
      refEl.innerHTML = '<span class="ok">✅ ' + escapeHtml(referrer) + '</span>';
    } else {
      refEl.innerHTML = '<span class="empty">❌ empty (in-app browser or direct access)</span>';
    }

    // Params
    const paramsEl = document.getElementById('params');
    if (paramEntries.length === 0) {
      paramsEl.innerHTML = '<div class="box"><span class="empty">No parameters</span></div>';
    } else {
      paramsEl.innerHTML = paramEntries.map(([k, v]) => {
        const isTracker = k === '_ads_sid';
        const isMeta = ['utm_creative','utm_medium','utm_source','utm_campaign','utm_content','utm_term','utm_id','fbclid','gclid','ttclid'].includes(k);
        const badge = isTracker ? ' <span style="color:#9b59b6;font-size:11px">[tracker]</span>'
                    : isMeta    ? ' <span style="color:#3498db;font-size:11px">[meta]</span>'
                    : '';
        return '<div class="box"><span class="key">' + escapeHtml(k) + '</span>: <span class="val">' + escapeHtml(v) + '</span>' + badge + '</div>';
      }).join('');
    }

    // Raw URL
    document.getElementById('rawurl').innerHTML = escapeHtml(window.location.href);

    // Timestamp
    document.getElementById('timestamp').innerHTML = new Date().toISOString();

    // Summary
    const hasAadsSid = params.has('_ads_sid');
    const hasReferrer = !!referrer;
    const hasUtm = params.has('utm_creative') || params.has('utm_medium');
    const total = paramEntries.length;

    let status = '';
    if (hasAadsSid && hasReferrer) {
      status = '<span class="ok">✅ PASS: _ads_sid あり・リファラあり</span>';
      document.getElementById('summary').style.background = '#1a3a1a';
    } else if (hasAadsSid && !hasReferrer) {
      status = '<span class="warn">⚠️ PARTIAL: _ads_sid あり・リファラなし (in-app browser?)</span>';
      document.getElementById('summary').style.background = '#3a2a00';
    } else {
      status = '<span class="empty">❌ FAIL: _ads_sid なし</span>';
      document.getElementById('summary').style.background = '#3a1a1a';
    }
    status += '<br><small style="font-size:13px;opacity:0.8">パラメータ数: ' + total + ' / UTM: ' + (hasUtm ? 'あり' : 'なし') + '</small>';
    document.getElementById('summary').innerHTML = status;

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
